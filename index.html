<style>
:root{--sky1:#bfe6ff;--sky2:#fff3c9;--hill1:#a8dca0;--hill2:#8fd08f;--ink:#5a3e36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fff6e0;font-family:"Baloo 2","Fredoka","Comic Sans MS",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#5a3e36}body{background:#fff6e0}}
:root[data-theme="dark"] body{background:#fff6e0}
.stage{width:100%;max-width:900px;border-radius:24px;overflow:hidden;border:5px solid var(--ink);box-shadow:0 8px 0 rgba(90,62,54,.25);background:#bfe6ff}
svg{display:block;width:100%;height:auto}
button{font:inherit;font-size:1.1rem;font-weight:700;color:var(--ink);background:#ffd966;border:4px solid var(--ink);border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid #4aa3ff;outline-offset:3px}
.cap{font-size:1.4rem;font-weight:800;min-height:1.6em;text-align:center}
/* animation */
.cloud{animation:drift 40s linear infinite}
.cloud.b{animation-duration:55s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
.sun{transform-origin:780px 90px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

@keyframes ride{from{transform:translateX(-420px)}to{transform:translateX(1000px)}}
.bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.puff{opacity:0;animation:puff 3s ease-out infinite}
.puff:nth-of-type(2){animation-delay:1s}.puff:nth-of-type(3){animation-delay:2s}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(-50px,-120px) scale(1.4) rotate(-20deg)}}
.wave{transform-box:fill-box;transform-origin:bottom center;animation:wave .8s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.river{animation:shim 2s ease-in-out infinite alternate}
@keyframes shim{from{opacity:.5}to{opacity:1}}
/* night */
.night-layer{opacity:0;transition:opacity 2.5s}
.dusk .night-layer{opacity:1}
.day-layer{transition:opacity 2.5s}
.dusk .day-layer{opacity:0}
.star{animation:tw 1.6s ease-in-out infinite alternate}
.star:nth-child(2n){animation-delay:.5s}.star:nth-child(3n){animation-delay:1s}
@keyframes tw{from{opacity:.3}to{opacity:1}}

@keyframes park{from{transform:translateX(-300px)}to{transform:translateX(380px)}}
.parked .puff,.parked .wheel,.parked .bob{animation-play-state:paused}
.sleepz{opacity:0;font-weight:800}
.dusk .sleepz{opacity:1;animation:z 3s ease-in-out 5s infinite}
@keyframes z{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.lyrics{width:100%;max-width:900px;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:12px 18px;text-align:center;box-shadow:0 5px 0 rgba(90,62,54,.25)}
.lyrics .ln{font-size:1.2rem;font-weight:700;opacity:.4;transition:all .3s}
.lyrics .ln.on{opacity:1;color:#d6456b;transform:scale(1.04)}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots button{padding:0;width:34px;height:34px;font-size:.95rem;box-shadow:0 3px 0 var(--ink)}
.dots button.cur{background:#ff9db8}
.v-wheels .wheel{animation-duration:.5s}.v-wheels .bob{animation-duration:.18s}
.whistle{transform-box:fill-box;transform-origin:bottom center}
.v-whistle .whistle{animation:toot .5s ease-in-out infinite}
.v-whistle .puff{animation-duration:1s}
@keyframes toot{50%{transform:scale(1.5,1.2)}}
.door{transform-box:fill-box;transform-origin:left center}
.v-doors .door{animation:door 1.6s ease-in-out infinite}
@keyframes door{0%,40%{transform:scaleX(1)}60%,90%{transform:scaleX(.15)}}
.v-animals .a{animation:hop .4s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6px)}}
.tear{opacity:0}
.v-baby .tear{animation:tear .8s ease-in infinite}
@keyframes tear{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.v-baby .baby,.v-mommy .mommy{transform-box:fill-box;transform-origin:center;animation:shake .3s ease-in-out infinite alternate}
.v-mommy .mommy{animation-duration:.9s}
@keyframes shake{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.stage{--sk1:#9bd8ff;--sk2:#fff3c9;--hs:#6fb96f}
.sc-2{--sk1:#7fb8e8;--sk2:#e6f4ff;--hill1:#7cc2a4;--hill2:#5fb08d;--hs:#4f9c7e}
.sc-3{--sk1:#ffcf9e;--sk2:#fff0c9;--hill1:#f0b85c;--hill2:#e39a46;--hs:#c9822e}
.sc-4{--sk1:#ffb3c6;--sk2:#ffe9a8;--hill1:#b8e07a;--hill2:#9fd36a;--hs:#7fb04e}
.sc-5{--sk1:#c9defa;--sk2:#f4f8ff;--hill1:#f2f8ff;--hill2:#dcebfa;--hs:#9bbbd6}
.sc-6{--sk1:#a9b8d0;--sk2:#dfe6f2;--hill1:#8cc9a0;--hill2:#75b98c;--hs:#5aa078}
.sc-7{--hill1:#5f9a8a;--hill2:#4d8878;--hs:#3e7466}
.mt,.lv,.sn,.rn,.rb,.barn{opacity:0;transition:opacity .5s}
.sc-1 .barn,.sc-4 .barn{opacity:1}
.sc-2 .mt,.sc-3 .lv,.sc-5 .sn,.sc-6 .rn,.sc-6 .rb{opacity:1}
.sc-5 .sun,.sc-6 .sun{opacity:0}
.sc-6 .cloud{fill:#b4bfd2}
.sc-3 .fl,.sc-5 .fl,.sc-6 .fl{opacity:0}
.sc-5 path.river{fill:#e3f3ff;stroke:#a8d0ee}
.lv *,.sn *,.rn *{transform-box:fill-box;transform-origin:center}
.lv *{animation:fall 6s linear infinite}
.sn *{animation:snow 8s linear infinite}
.rn *{animation:rain .7s linear infinite}
.lv *:nth-child(2n),.sn *:nth-child(2n){animation-delay:-2s}
.lv *:nth-child(3n),.sn *:nth-child(3n){animation-delay:-4s}
.rn *:nth-child(2n){animation-delay:-.3s}
@keyframes fall{to{transform:translateY(480px) rotate(220deg)}}
@keyframes snow{to{transform:translateY(480px)}}
@keyframes rain{to{transform:translate(-30px,480px)}}
.ch{opacity:0;transition:opacity .5s}
.sc-1 .c1,.sc-2 .c2,.sc-4 .c4,.sc-5 .c5,.sc-7 .owl,.sc-3 .fg,.sc-6 .fg{opacity:1}
.hop{animation:hopb .6s ease-in-out infinite alternate}
.hop.d{animation-delay:-.3s}
@keyframes hopb{to{transform:translateY(-10px)}}
.wag{transform-box:fill-box;transform-origin:100% 100%;animation:wagt .3s ease-in-out infinite alternate}
@keyframes wagt{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.fly{animation:fly 9s linear infinite}
@keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(900px,-20px)}}
.flap{transform-box:fill-box;transform-origin:100% 100%;animation:flapb .3s ease-in-out infinite alternate}
@keyframes flapb{to{transform:scaleY(.3)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blk 3s infinite}
@keyframes blk{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bshirt{fill:#4aa3ff}.sc-6 .bshirt{fill:#ffd23f}
.umb{opacity:0}.sc-6 .umb{opacity:1}
.stage{position:relative}
svg{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.score{position:absolute;left:10px;top:10px;z-index:2;font-weight:800;font-size:1.15rem;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;pointer-events:none}
.score.bump{animation:boing .4s}
.ch{pointer-events:none}
.sc-1 .c1,.sc-2 .c2,.sc-4 .c4,.sc-5 .c5,.sc-7 .owl,.sc-3 .fg,.sc-6 .fg{pointer-events:auto}
.boing{transform-box:fill-box;transform-origin:50% 100%;animation:boing .5s}
@keyframes boing{30%{transform:scale(1.35,.8)}60%{transform:scale(.9,1.2)}100%{transform:scale(1)}}
.gs{transition:opacity .5s}.gs.out{opacity:0}
.gsi{transform-box:fill-box;transform-origin:center;cursor:pointer;animation:popin .4s ease-out,twk 1.4s ease-in-out .4s infinite alternate}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes twk{to{transform:scale(1.15) rotate(8deg)}}
.fx{position:absolute;z-index:3;pointer-events:none;font-size:clamp(18px,4.5vw,30px);will-change:transform,opacity;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-50px) scale(1.3)}}
.fx.big{font-size:clamp(34px,9vw,64px);font-weight:800;color:#d6456b;text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 6px #fff}
@keyframes yay{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
.tooting .whistle{animation:toot .25s ease-in-out 3}
.sun{transform-origin:720px 80px;pointer-events:auto;cursor:pointer}
.sc-5 .sun,.sc-6 .sun,.dusk .sun{pointer-events:none}
.rays{opacity:0;transition:opacity .3s;transform-box:fill-box;transform-origin:center}
.sun.happy{animation:sunhappy 1s ease-in-out}
.sun.happy .rays{opacity:1;animation:spin 1s linear}
@keyframes sunhappy{40%{transform:scale(1.3)}100%{transform:scale(1)}}
.grin{opacity:0}.sun.happy .grin{opacity:1}
.sun.happy .eyeR{transform-box:fill-box;transform-origin:center;animation:wk 1s}
@keyframes wk{20%,80%{transform:scaleY(.12)}}
.cloud{transition:opacity .5s}.clear .cloud{opacity:0}
.zoom .wheel{animation-duration:.3s}
[data-s]{cursor:pointer}
body{padding:0;gap:0}
.stage{flex:none;max-width:none;width:min(100vw,calc(100dvh*1.7778));border:0;border-radius:0;box-shadow:none}
.menu{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(255,246,224,.55);backdrop-filter:blur(3px);transition:opacity .3s}

.mcard h1{margin:0 0 clamp(8px,2vw,18px);font-size:clamp(1.3rem,5vw,2.6rem)}
.big{font-size:clamp(1.2rem,4vw,2rem);padding:clamp(8px,2vw,14px) clamp(28px,8vw,70px);background:#7ddc7d}

.menubtn{right:64px}
.train,.coin{pointer-events:none}
.snd{top:10px;bottom:auto;left:150px;right:auto}
.menubtn{left:204px;right:auto}
.bubble{display:none}
.drv{position:absolute;left:12px;bottom:12px;z-index:3;width:clamp(52px,9vw,76px);height:clamp(52px,9vw,76px);border-radius:50%;padding:0;font-size:1.7rem;background:rgba(255,217,102,.9);touch-action:none;user-select:none}

.back .wheel{animation-direction:reverse}
.menuopen .puff,.menuopen .cloud{animation-play-state:paused}
.dz{display:none}.tr-1 .t1,.tr-2 .t2,.tr-3 .t3,.tr-4 .t4,.tr-5 .t5{display:inline}
.flame{transform-box:fill-box;transform-origin:right center;animation:flick .15s infinite alternate}
@keyframes flick{to{transform:scaleX(.7)}}
.deco{opacity:0;transition:opacity .5s;pointer-events:none}
.sc-8 .c8,.sc-9 .c9,.sc-10 .c10{opacity:1}
.sc-8{--sk1:#ffb26b;--sk2:#ffe3a8;--hill1:#e8b86d;--hill2:#d9a24f;--hs:#b9822e}
.sc-9{--sk1:#ffd9ec;--sk2:#fff5fb;--hill1:#c9ecc0;--hill2:#a8dca0;--hs:#7fbf7f}
.sc-10{--sk1:#d8b8ff;--sk2:#ffe0f2;--hill1:#ffb8d6;--hill2:#b8e8ff;--hs:#e28fb8}
.sc-9 .lv,.sc-10 .sn{opacity:1}
.sc-9 .lv ellipse{fill:#ffb3d1}
.sc-10 .sn circle{fill:#ff9db8}.sc-10 .sn circle:nth-child(3n){fill:#9be7ff}.sc-10 .sn circle:nth-child(3n+1){fill:#ffe27a}
.sc-8 .fl,.sc-10 .fl{opacity:0}
.lb{min-width:110px;font-size:clamp(.8rem,2vw,1rem);padding:8px 10px;line-height:1.2}
.hud{position:absolute;left:10px;top:58px;z-index:2;pointer-events:none;font-weight:800;font-size:clamp(.8rem,2.2vw,1.05rem);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;background:linear-gradient(90deg,#9be79b var(--p,0%),#fff var(--p,0%))}
.shop{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(255,246,224,.85)}
.shop.on{display:flex}
.scard{background:#fff;border:5px solid var(--ink);border-radius:24px;padding:clamp(10px,2.5vw,22px);max-width:92%;max-height:94%;overflow:auto;text-align:center}
.scard h2{margin:0 0 8px;font-size:clamp(1.1rem,3.5vw,1.8rem)}
.sgrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.sitem{border:4px solid var(--ink);border-radius:16px;padding:8px 10px;min-width:96px;font-weight:700;font-size:clamp(.75rem,2vw,1rem)}
.sitem.eq{background:#d9f7d9}
.sw{display:flex;gap:4px;justify-content:center;margin:4px 0}.sw i{width:22px;height:22px;border-radius:6px;border:3px solid var(--ink);display:block}
.sitem button{font-size:inherit;padding:4px 12px;box-shadow:0 3px 0 var(--ink)}
.cn{transform-box:fill-box;transform-origin:center;animation:cspin 1.2s linear infinite}
@keyframes cspin{50%{transform:scaleX(.25)}}
.rot{display:none;position:fixed;inset:0;z-index:20;background:#fff6e0;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;font-weight:800;font-size:1.4rem;padding:24px}
@media (orientation:portrait) and (max-width:700px){.rot:not(.off){display:flex}}
body{justify-content:safe center}
.snd{position:absolute;right:10px;bottom:10px;z-index:2;width:44px;height:44px;padding:0;font-size:1.3rem;box-shadow:0 3px 0 var(--ink)}
button{font-family:inherit;font-weight:800;background:linear-gradient(#fff6c2,#ffd54a);border:3px solid var(--ink);border-radius:16px;padding:8px 18px;box-shadow:0 4px 0 #b9801a;transition:transform .08s,filter .15s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b9801a}
.drv{border-radius:50%}
.score,.hud{box-shadow:0 3px 0 rgba(74,52,45,.35)}
.menu{backdrop-filter:none;background:linear-gradient(rgba(120,190,255,.55),rgba(255,236,190,.65))}
.menu.hide{visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.mcard{background:none;border:0;box-shadow:none;padding:0;animation:rise2 .7s ease-out}
@keyframes rise2{from{opacity:0;transform:translateY(24px)}}
.logo{line-height:.95;animation:bobl 3s ease-in-out infinite}
.l1{display:block;font-size:clamp(1rem,3.4vw,1.9rem);letter-spacing:.35em;text-transform:uppercase;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;font-weight:900}

@keyframes bobl{50%{transform:translateY(-6px)}}
.sub{margin:clamp(6px,1.5vw,14px) 0;font-weight:800;color:var(--ink);font-size:clamp(.8rem,2.2vw,1.2rem)}

@keyframes pul{50%{transform:scale(1.06)}}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 #1f6b34;animation:none}
.mrow{gap:clamp(8px,2vw,16px);margin-top:clamp(12px,2.5vw,24px)}
.mrow button{background:#fff;border-radius:18px;min-width:clamp(86px,15vw,130px);font-size:clamp(.8rem,2vw,1.05rem);padding:8px 10px;line-height:1.25}
.stats{margin-top:clamp(8px,2vw,16px);display:inline-flex;gap:14px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.8);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;font-weight:800;font-size:clamp(.75rem,1.9vw,1rem)}
.mhint{display:none}
.shop{background:linear-gradient(rgba(120,190,255,.6),rgba(255,236,190,.85))}
.scard{background:linear-gradient(#fff,#fff6dc);border-radius:26px;box-shadow:0 10px 0 rgba(74,52,45,.25),0 20px 50px rgba(0,0,0,.25);animation:rise2 .35s ease-out}
.scard h2{color:var(--ink);font-size:clamp(1.2rem,3.8vw,2rem)}
.sitem{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 rgba(74,52,45,.3)}
.sitem.eq{background:linear-gradient(#e6ffe6,#b8f5c0)}
.lb{background:#fff;border-radius:18px}
.bar{height:8px;border-radius:6px;background:#e7dcc3;margin:4px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ddc7d,#ffd54a,#ff7a5c)}

</head>
<body>
<div class="stage" id="stage">
